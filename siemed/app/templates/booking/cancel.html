{% extends "base.html" %}
{% block title %}Отмена записи{% endblock %}
{% block nav %}
<nav class="nav"><a href="/">Запись</a><a href="/cancel" class="active">Отмена</a></nav>
{% endblock %}
{% block body %}
<main class="wrap hero">
  <h1>Отменить запись</h1>
  <p class="lead">Нужны код с экрана подтверждения и ФИО, которые вы указывали.</p>
  {% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}
  {% if ok %}<div class="alert alert-ok">{{ ok }}</div>{% endif %}
  <form class="card" method="post" action="/cancel" style="max-width:520px">
    <div class="field"><label>Код</label><input name="code" required placeholder="AB12CD" style="text-transform:uppercase"></div>
    <div class="field"><label>ФИО</label><input name="fio" required></div>
    <button class="btn btn-dark btn-block" type="submit">Отменить запись</button>
  </form>
</main>
{% endblock %}
